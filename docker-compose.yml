

# CAB Booking System - Docker Compose Configuration
# ================================================
#
# Usage:
#   docker-compose up -d --build

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES (Base Profile)
  # ============================================================================

  # Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cab-booking-rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: cab_admin
      RABBITMQ_DEFAULT_PASS: cab123!@#
      RABBITMQ_DEFAULT_VHOST: cab-booking
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./message-broker/rabbitmq/rabbitmq-init.sh:/docker-entrypoint-initdb.d/rabbitmq-init.sh
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cab-booking-postgres
    environment:
      POSTGRES_DB: cab_booking
      POSTGRES_USER: cab_user
      POSTGRES_PASSWORD: cab_pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cab_user -d cab_booking"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: cab-booking-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: cab_admin
      MONGO_INITDB_ROOT_PASSWORD: cab_pass123
      MONGO_INITDB_DATABASE: cab_booking
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cab-booking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./database/redis/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: cab-booking-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: cab_minio_admin
      MINIO_ROOT_PASSWORD: cab_minio_secret123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # ============================================================================
  # MICROSERVICES (Development/Production/Full Profiles)
  # ============================================================================

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: cab-booking-auth-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://cab_user:cab_pass123@postgres:5432/cab_booking
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key}
      - JWT_EXPIRE=${JWT_EXPIRE:-15m}
      - REFRESH_TOKEN_EXPIRE=${REFRESH_TOKEN_EXPIRE:-7d}
      - PORT=3004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/auth/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: cab-booking-user-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - MONGODB_URL=mongodb://cab_admin:cab_pass123@mongodb:27017/cab_booking?authSource=admin
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - PORT=3005
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/api/users/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # Driver Service
  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    container_name: cab-booking-driver-service
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://cab_user:cab_pass123@postgres:5432/cab_booking
      - MONGODB_URL=mongodb://cab_admin:cab_pass123@mongodb:27017/cab_booking?authSource=admin
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - PORT=3007
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3007/api/drivers/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # Booking Service
  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: cab-booking-booking-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://cab_user:cab_pass123@postgres:5432/cab_booking
      - MONGODB_URL=mongodb://cab_admin:cab_pass123@mongodb:27017/cab_booking?authSource=admin
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key}
      - PRICING_SERVICE_URL=http://pricing-service:3001
      - DRIVER_SERVICE_URL=http://driver-service:3007
      - ETA_SERVICE_URL=http://eta-service:3011
      - PAYMENT_SERVICE_URL=http://payment-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:3008
      - MATCHING_SERVICE_URL=http://matching-service:3014
      - PRICING_TIMEOUT_MS=2500
      - PRICING_RETRY_COUNT=2
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3003/api/bookings/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # Ride Service
  ride-service:
    build:
      context: ./services/ride-service
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: cab-booking-ride-service
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://cab_user:cab_pass123@postgres:5432/cab_booking
      - MONGODB_URI=mongodb://cab_admin:cab_pass123@mongodb:27017/cab_booking?authSource=admin
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key}
      - PORT=3009
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3009/api/rides/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # Payment Service
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: cab-booking-payment-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://cab_user:cab_pass123@postgres:5432/cab_booking
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - PORT=3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/payments/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # Pricing Service
  pricing-service:
    build:
      context: .
      dockerfile: services/pricing-service/Dockerfile
    container_name: cab-booking-pricing-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://cab_user:cab_pass123@postgres:5432/cab_booking
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/pricing/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # Matching Service
  matching-service:
    build:
      context: .
      dockerfile: services/matching-service/Dockerfile
    container_name: cab-booking-matching-service
    ports:
      - "3014:3014"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DRIVER_SERVICE_URL=http://driver-service:3007
      - PRICING_SERVICE_URL=http://pricing-service:3001
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - PORT=3014
    depends_on:
      driver-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3014/api/matching/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # Notification Service
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: cab-booking-notification-service
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3008
      - MONGO_URI=mongodb://cab_admin:cab_pass123@mongodb:27017/cab_notification_db?authSource=admin
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - CORS_ORIGIN=http://localhost:5173
      - CLIENT_URL=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3008/api/notifications/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # ETA Service
  eta-service:
    build:
      context: .
      dockerfile: services/eta-service/Dockerfile
    container_name: cab-booking-eta-service
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3011
      - CORS_ORIGIN=http://localhost:5173
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3011/api/eta/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # Fraud Service
  fraud-service:
    build:
      context: ./services/fraud-service
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: cab-booking-fraud-service
    ports:
      - "3012:3012"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3012
      - CORS_ORIGIN=http://localhost:5173
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3012/api/fraud/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # Review Service
  review-service:
    build:
      context: ./services/review-service
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: cab-booking-review-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - MONGODB_URL=mongodb://cab_admin:cab_pass123@mongodb:27017/cab_booking?authSource=admin
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - CORS_ORIGIN=http://localhost:8080,http://localhost:3000
      - PORT=3006
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/api/reviews/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  # Storage Service (MinIO Gateway)
  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: cab-booking-storage-service
    ports:
      - "3015:3015"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3015
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=cab_minio_admin
      - MINIO_SECRET_KEY=cab_minio_secret123
      - MINIO_BUCKET=cab-documents
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3015/api/storage/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # ============================================================================
  # API GATEWAY (Development/Production/Full Profiles)
  # ============================================================================

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: cab-booking-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080,http://localhost:3000
      - AUTH_SERVICE_URL=http://auth-service:3004
      - USER_SERVICE_URL=http://user-service:3005
      - DRIVER_SERVICE_URL=http://driver-service:3007
      - BOOKING_SERVICE_URL=http://booking-service:3003
      - RIDE_SERVICE_URL=http://ride-service:3009
      - PAYMENT_SERVICE_URL=http://payment-service:3002
      - PRICING_SERVICE_URL=http://pricing-service:3001
      - ETA_SERVICE_URL=http://eta-service:3011
      - NOTIFICATION_SERVICE_URL=http://notification-service:3008
      - REVIEW_SERVICE_URL=http://review-service:3006
      - STORAGE_SERVICE_URL=http://storage-service:3015
    depends_on:
      - auth-service
      - user-service
      - driver-service
      - booking-service
      - ride-service
      - payment-service
      - pricing-service
      - eta-service
      - notification-service
      - review-service
      - storage-service
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # ============================================================================
  # REAL-TIME SERVICES (Development/Production/Full Profiles)
  # ============================================================================

  realtime-socket:
    build:
      context: ./realtime/socket-server
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: cab-booking-realtime-socket
    ports:
      - "3013:3011"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080,http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://cab_admin:cab123%21%40%23@rabbitmq:5672/cab-booking
      - RIDE_SERVICE_URL=http://ride-service:3009
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key}
      - SOCKET_AUTH_REQUIRED=false
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cab-booking-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3011/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # ============================================================================
  # FRONTEND (Full Profile Only)
  # ============================================================================

  customer-app:
    build:
      context: ./clients
      dockerfile: customer-app/Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
        - VITE_SOCKET_URL=http://localhost:3013
    container_name: cab-frontend-customer
    ports:
      - "5173:80"
    networks:
      - cab-booking-network
    restart: unless-stopped
  driver-app:
    build:
      context: ./clients
      dockerfile: driver-app/Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
        - VITE_SOCKET_URL=http://localhost:3013
    container_name: cab-frontend-driver
    ports:
      - "5174:80"
    networks:
      - cab-booking-network
    restart: unless-stopped
  admin-dashboard:
    build:
      context: ./clients
      dockerfile: admin-dashboard/Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
        - VITE_SOCKET_URL=http://localhost:3013
    container_name: cab-frontend-admin
    ports:
      - "5175:80"
    networks:
      - cab-booking-network
    restart: unless-stopped
volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  cab-booking-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16